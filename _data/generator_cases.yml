  view_events: 100
  event_image: assets/images/examples/generator_manipulations/gemc_sphere.png
  particle: |
    gparticle:
    - name: geantino
      p: 1*GeV
      theta: 45*deg
      phi: 90*deg
      vx: 2*mm
      vy: -3*mm
      vz: 0*mm
      delta_vx: 1*mm
      delta_vy: 2*mm
      delta_vz: 2*mm
      randomVertexModel: sphere
