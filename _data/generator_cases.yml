- name: uniform_z
  title: Uniform z
  group: Vertices
  expected: Uniform half-width in z; the other two coordinates stay fixed.
  events: 5000
  view_events: 100
  event_image: assets/images/examples/generator_manipulations/gemc_uniform_z.png
  particle: |
    gparticle:
    - name: geantino
      p: 1*GeV
      theta: 90*deg
      phi: 90*deg
      vx: 2*mm
      vy: -3*mm
      vz: 0*mm
      delta_vx: 0*mm
      delta_vy: 0*mm
      delta_vz: 20*mm
      randomVertexModel: uniform
  image: assets/images/examples/generator_manipulations/analyzer_uniform_z.png
