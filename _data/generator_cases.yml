- name: fixed_theta_and_phi
  title: Fixed theta and phi
  group: Angles
  expected: Fixed theta = 3 deg and phi = 45 deg.
  events: 5000
  view_events: 100
  event_image: assets/images/examples/generator_manipulations/gemc_fixed_theta_and_phi.png
  particle: |
    gparticle:
    - name: geantino
      p: 1*GeV
      theta: 3*deg
      delta_theta: 0*deg
      randomThetaModel: uniform
      phi: 45*deg
      delta_phi: 0*deg
      vx: 0*mm
      vy: 0*mm
      vz: 0*mm
      delta_vx: 0*mm
      delta_vy: 0*mm
      delta_vz: 0*mm
      randomVertexModel: uniform
  image: assets/images/examples/generator_manipulations/analyzer_fixed_theta_and_phi.png
