- title: 发生器操作
  header: 11 个经过验证的顶点与角度案例，并带有 Analyzer 图
  category: 基础
  link: /home/examples/basic/generator_manipulations
  display: true
  gallery: true
  source_dir: ../src/examples/basic/generator_manipulations
  vtksz: /home/assets/images/examples/generator_manipulations/generator_manipulations.vtksz
  vtz_zoom: 0.04
  snevents: 100
  screenshot_commands:
  - /vis/geometry/set/visibility root 0 false
  - /vis/viewer/set/viewpointThetaPhi 75 15 deg
  - /vis/viewer/set/targetPoint 0 0 0 mm
  - /vis/viewer/zoom 1.6
  - /vis/modeling/trajectories/drawByParticleID-0/set geantino cyan
  pevents: 5000
  steering_cards:
  - uniform_z.yaml
  - uniform_xy.yaml
  - gaussian_z.yaml
  - gaussian_xy.yaml
  - sphere.yaml
  - fixed_theta_and_phi.yaml
  - uniform_theta.yaml
  - gaussian_theta.yaml
  - cosine_theta.yaml
  - uniform_phi.yaml
  - phi_wraparound.yaml
