  pevents: 5000
  steering_cards:
  - uniform_z.yaml
  - uniform_xy.yaml
  - gaussian_z.yaml
  - gaussian_xy.yaml
  - sphere.yaml
  - fixed_theta_and_phi.yaml
  - uniform_theta.yaml
  - gaussian_theta.yaml
  - cosine_theta.yaml
  - uniform_phi.yaml
  - phi_wraparound.yaml
